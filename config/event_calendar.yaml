# 미국 주요 경제 일정 — 일정 알림(scripts/event_alert.py)이 읽는다. 매매 규칙과 무관한 '경고' 용.
#
# 출처 (2026-10-15 확인, 사용자 '오늘은 어떠한 일정이 있으니 들어가는 건 보류 해라 뭐 이런식으로'):
#   BLS CPI       https://www.bls.gov/schedule/news_release/cpi.htm
#   BLS 고용      https://www.bls.gov/schedule/news_release/empsit.htm
#   BLS PPI       https://www.bls.gov/schedule/news_release/ppi.htm
#   10월 누락 대조 https://www.bls.gov/schedule/2026/10_sched.htm (2026-10-15 재확인)
#   연준 FOMC     https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm (결정 발표 = 둘째 날 14:00 ET)
#   BEA GDP · PCE https://www.bea.gov/news/schedule
# 날짜 · 시각은 미국 동부 시간(ET). 기관이 일정을 바꾸면 여기를 고친다.
