# A1/v1: 2026-09-23 사전등록 개정. 성과 열람 전 고정된 연구 전략.
# load_config(strategy="a1_v1")으로 명시적으로 불러온다.
strategy_id: a1_v1
a1:
  volatility_hours: 24
  rank_days: 30
  contraction_quantile_pct: 0.30
  trend_hours: 200
  range_hours: 6
  hold_minutes: 120
  stop_sigma_multiple: 2.0
  trigger_lock_minutes: 360
  control_without_contraction: false
risk:
  tight_stop_action: REDUCE_POSITION
  cost:
    # taker 왕복 9bps + 예상 슬리피지 왕복 11bps = 20bps.
    # 고가/저가 트리거의 성과 미열람 비용 대리치 19.91bps보다 보수적이다.
    slippage_entry_rate: 0.00055
  take_profit:
    enabled: false
