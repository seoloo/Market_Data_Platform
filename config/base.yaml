# 기본 설정 — 모든 모드의 출발점
#
# [확정] 표시가 붙은 값은 docs/phase0/13-decisions.md 에서 확정된 것이며,
# 느슨하게 조정하려면 사용자 승인이 필요하다 (AGENTS.md §6).
#
# 시크릿(API 키·토큰)은 여기 넣지 않는다. 환경변수(.env)로 전달한다.
# 로더가 시크릿으로 보이는 키를 발견하면 기동을 거부한다.
#
# 모드별 차이는 config/<mode>.yaml 이 덮어쓴다.

mode: backtest
symbol: BTCUSDT
exchange: binance_usdm

# ============================================================ 리스크 (D9)
risk:
  # --- 사이징: 손절 우선 역산. 레버리지는 결과값 -------------------------
  sizing_mode: risk_based           # [확정]
  risk_per_trade: 0.01              # [확정] 거래당 최대 손실 = equity × 1%
  margin_allocation: 0.10           # [확정] 증거금 "상한" (목표 아님)
  max_leverage: 10                  # [확정] 설계 천장. live 모드는 5 이하로 강제됨
  min_stop_distance: 0.01           # [확정] 캡 발동선 0.85% 바로 위
  max_rounding_error: 0.05          # [확정] 초과 시 SIZING_RESOLUTION veto
  liquidation_safety_buffer: 2.0    # [확정] 청산거리 >= 2 × 손절거리

  leverage_limit_action: REDUCE_POSITION   # REDUCE_POSITION | SKIP_TRADE
  tight_stop_action: WIDEN                 # WIDEN | SKIP

  # 명목가 상한 = margin_allocation × max_leverage = equity 의 100%
  # 이 값이 갭·슬리피지 꼬리위험의 실질적 상한이다 (05 §3.8)

  # --- 비용 추정 (사이징 공식의 입력) ------------------------------------
  # 수수료율은 거래소 API 로 갱신한다. 아래는 취득 실패 시 보수적 기본값.
  cost:
    taker_fee_rate: 0.00045
    maker_fee_rate: 0.00020
    slippage_entry_rate: 0.00020    # Phase 8 실측으로 보정
    slippage_stop_multiple: 2.0     # 스톱은 유동성 공백에서 체결됨
    include_funding: true
    expected_funding_rate: 0.0

  # --- 손절 위치 규칙 (05 §3.1) -----------------------------------------
  stop:
    mode: structure_or_atr
    atr_timeframe: 1h
    atr_period: 14
    atr_multiple: 1.5
    swing_threshold_pct: 0.02       # ZigZag 임계. 실측 확정지연 평균 6.3h / 최대 70h
    swing_buffer_atr: 0.2           # 스윙 저점 바로 밑은 노이즈에 걸린다
    pick: wider                     # 더 먼 손절이 항상 더 안전하다

  take_profit:
    enabled: true
    mode: r_multiple                # [확정] 손절폭이 가변이므로 R 배수
    r_multiple: 2.0                 # 잠정 — Phase 4 에서 결정

  # --- 손실 한도 ---------------------------------------------------------
  daily_loss_limit_pct: 0.02        # [확정] 손절 2회분
  max_drawdown_pct: 0.10            # [확정] 누적 DD -> HALTED (자동 해제 없음)
  consecutive_loss_limit: 4
  cooldown_after_losses_min: 240

  # --- 거래 빈도 / 보유 (D2: 보유기간 2~24h) -----------------------------
  daily_trade_limit: 2              # [확정] 한도는 이상 동작 탐지용이다
  min_hold_minutes: 120             # [확정]
  reentry_cooldown_minutes: 60      # [확정]
  max_holding_hours: 48             # [확정] 2차 탈출 경로 (G4.9)
  same_direction_limit: 2
  max_unprotected_ms: 5000          # 초과 시 포지션 강제 청산

  # --- 변동성 게이트 (G5.1 / G5.2) ---------------------------------------
  volatility_gate:
    enabled: true
    timeframe: 1h
    atr_period: 14
    lookback_days: 365
    atr_pct_lower: 0.05             # 너무 잠잠하면 수수료만 나간다
    atr_pct_upper: 0.98             # 너무 심하면 손절이 제값에 안 된다

  # --- 경제지표 블랙아웃 (G6) --------------------------------------------
  blackout:
    FOMC:   {before_min: 60, after_min: 30}
    CPI:    {before_min: 30, after_min: 15}
    PCE:    {before_min: 20, after_min: 15}
    NFP:    {before_min: 30, after_min: 15}
    POWELL: {before_min: 15, after_min: 15}

  killswitch:
    mode: block_entries             # block_entries | flatten
    file_path: data/KILL

# ============================================================ 지표 (D1: 5개)
# 사람이 읽는 설명은 docs/STRATEGY-CATALOG.md 에 있다.
# 가중치는 등가중 고정. 백테스트로 최적화하지 않는다 (12-critique §2).
features:
  # B1 — 4시간 EMA(50) 추세  [방향 허가]
  # ATR 단위 정규화. z-score 는 지속 추세에서 0 으로 수렴해 쓰지 않는다 (2026-09-21)
  b1_trend:
    enabled: true
    timeframe: 4h
    weight: 1.0
    params:
      ema_period: 50
      atr_period: 14
      slope_bars: 10                # 기울기 구간 (1봉은 노이즈가 큼)

  # B2 — 1시간 ATR 변동성 국면  [거래 허가 + 크기]
  b2_volregime:
    enabled: true
    timeframe: 1h
    weight: 1.0
    params:
      atr_period: 14
      lookback_days: 365

  # T1 — 15분 RSI(14) 되돌림  [진입 타이밍]
  t1_pullback:
    enabled: true
    timeframe: 15m
    weight: 0.5                     # T1/T2 등가중
    params:
      rsi_period: 14
      long_zone: [35.0, 50.0]
      short_zone: [50.0, 65.0]
      invalidate_below: 30.0
      invalidate_above: 70.0

  # T2 — 5분 모멘텀  [진입 타이밍]
  t2_momentum:
    enabled: true
    timeframe: 5m
    weight: 0.5                     # T1/T2 등가중
    params:
      return_bars: 6                # 30분
      zscore_lookback: 288          # 24시간
      min_abs_z: 0.3
      squash_k: 1.5

  # T3 — 5분 거래량 확인  [곱셈. 더하지 않는다]
  t3_volume:
    enabled: true
    timeframe: 5m
    weight: 0.0                     # 가중합에 들어가지 않고 곱해진다
    params:
      sma_period: 20
      strong_ratio: 1.2
      weak_ratio: 0.8
      confirm_strong: 1.0
      confirm_normal: 0.8
      confirm_weak: 0.6

# ============================================================ 진입·청산 정책
policy:
  long_entry_threshold: 70.0
  long_exit_threshold: 45.0         # 진입보다 낮게 = 히스테리시스
  short_entry_threshold: 70.0
  short_exit_threshold: 45.0
  bias_threshold: 0.5               # |B1| (ATR 배수) 이 미만이면 진입 금지
  allow_counter_bias_when_neutral: false
  reversal_requires_flat: true      # 롱->숏 직접 전환 금지
  minimum_required_edge_bps: 5.0
  confidence_full_at: 0.6

# ============================================================ 데이터
data:
  timeframes: [1m, 5m, 15m, 1h, 4h, 1d]
  db_path: data/trading.db
  candle_dir: data/candles
  staleness_multiple: 1.5           # 봉 길이 × 이 값을 넘으면 stale
  warmup_safety_bars: 50
  account_snapshot_interval_sec: 60 # [D10] 자산 곡선 해상도

# ============================================================ 실행
execution:
  client_order_id_prefix: a3f2      # 전략 인스턴스 id. 재시작해도 동일해야 한다
  order_timeout_ms: 10000
  max_order_retries: 3
  reconcile_interval_sec: 60
  clock_drift_warn_ms: 1000
  clock_drift_halt_ms: 5000
  orphan_policy: flatten            # 진입 근거를 모르는 포지션은 정리한다

# ============================================================ 대시보드 (D10)
ui:
  enabled: false                    # Phase 6 에서 켠다
  host: 127.0.0.1                   # 로컬 전용. 외부 노출 금지
  port: 8787
  display_timezone: UTC             # Risk Engine 일일 리셋과 동일 기준
  poll_seconds: 5

# ============================================================ 알림
notify:
  telegram_enabled: false
  daily_report_utc_hour: 0
  min_severity: info
