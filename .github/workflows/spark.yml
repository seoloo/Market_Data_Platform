name: Spark

# Spark 시험(tests/mdp/spark)을 Spark + Delta 이미지 안에서 (README C-3).
# 사용량 절약 (AGENTS.md §6):
# - 파이프라인 코드 · Spark 시험 · Spark 이미지가 바뀔 때만 돈다(그 밖의 변경은 ci.yml 만).
# - 이미지 층은 GitHub Actions 캐시에 남겨 두 번째부터 다시 받지 않는다.
# - 같은 브랜치에 새 푸시가 오면 이전 실행을 취소한다.
on:
  push:
    branches: [main]
    paths:
      - "src/mdp/**"
      - "tests/mdp/spark/**"
      - "docker/spark/**"
      - ".github/workflows/spark.yml"
  pull_request:
    paths:
      - "src/mdp/**"
      - "tests/mdp/spark/**"
      - "docker/spark/**"
      - ".github/workflows/spark.yml"
  workflow_dispatch:

concurrency:
  group: spark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spark-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Spark + Delta 이미지 (층 캐시)
        uses: docker/build-push-action@v6
        with:
          context: docker/spark
          load: true
          tags: mdp-spark:ci
          cache-from: type=gha,scope=spark
          cache-to: type=gha,scope=spark,mode=max
      - name: Spark 시험 (컨테이너 안 — docker compose 의 spark 서비스와 같은 연결)
        run: >
          docker run --rm
          -v "$PWD/src:/app/src:ro" -v "$PWD/tests:/app/tests:ro"
          -e MDP_SPARK_MEMORY=4g -e MDP_SPARK_CORES=2
          mdp-spark:ci python -m pytest tests/mdp/spark -q -p no:cacheprovider
