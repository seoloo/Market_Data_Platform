name: Secrets

# 시크릿 검사는 문서만 바뀐 푸시에도 매번 돈다 (AGENTS.md §4). 짧은 작업 하나라 사용량이 작다.
on:
  push:
    branches: [main]
  pull_request:

# 이전 실행을 취소하지 않는다 — 푸시마다 그 푸시의 커밋 범위만 검사하므로, 취소하면 그 커밋들이 빠진다.

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
