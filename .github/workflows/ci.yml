name: CI

# GitHub Actions 사용량 절약 (AGENTS.md §6):
# - 문서·보고서만 바뀐 푸시/PR 은 건너뛴다 (시크릿 검사는 secrets.yml 이 매번 한다).
# - 같은 브랜치에 새 푸시가 오면 이전 실행을 취소한다.
# - 설치를 한 번만 하도록 품질 검사와 시험을 한 작업(job)으로 묶고 pip 캐시를 쓴다.
# 커밋 전 로컬 검증(pytest · leakage · mypy · ruff · lint-imports)이 1 차 관문이고 CI 는 뒷받침이다.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "reports/**"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "reports/**"
      - ".claude/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy (strict)
        run: mypy
      - name: import-linter (Pure Core 경계)
        run: lint-imports
      - name: pytest
        run: pytest
      - name: look-ahead 누출 테스트 (스킵 금지)
        run: pytest -m leakage -v
