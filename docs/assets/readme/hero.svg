</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".6" stop-color="#132a5e"/><stop offset="1" stop-color="#1f6feb"/></linearGradient></defs><rect width="880" height="220" rx="18" fill="url(#bg)"/><polyline points="40,170 120,150 190,160 260,120 330,132 410,92 470,104 540,70 610,84 690,52 760,64 840,36" fill="none" stroke="#58a6ff" stroke-width="2.5" opacity=".35"/><text x="40" y="70" style="fill:#ffffff;font:800 38px -apple-system,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif">Auto_Trading</text><text x="40" y="102" style="fill:#c9d1d9;font:500 16px -apple-system,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif">결과를 보기 전에 규칙을 고정하고, 한 번만 판정하고, 통과한 것만 소액으로 돌린다</text><rect x="40" y="140" width="86" height="34" rx="17" fill="#ffffff" opacity=".12"/><text x="54" y="162" style="fill:#e6edf3;font:600 13px -apple-system,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif">실거래 <tspan style="fill:#79c0ff">2</tspan></text><rect x="136.1" y="140" width="156" height="34" rx="17" fill="#ffffff" opacity=".12"/><text x="150.1" y="162" style="fill:#e6edf3;font:600 13px -apple-system,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif">Paper · 그림자 <tspan style="fill:#79c0ff">12</tspan></text><rect x="302.4" y="140" width="131" height="34" rx="17" fill="#ffffff" opacity=".12"/><text x="316.4" y="162" style="fill:#e6edf3;font:600 13px -apple-system,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif">연구 문서 <tspan style="fill:#79c0ff">190+</tspan></text><rect x="443.2" y="140" width="144" height="34" rx="17" fill="#ffffff" opacity=".12"/><text x="457.2" y="162" style="fill:#e6edf3;font:600 13px -apple-system,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif">테스트 파일 <tspan style="fill:#79c0ff">290+</tspan></text><rect x="597.5" y="140" width="96" height="34" rx="17" fill="#ffffff" opacity=".12"/><text x="611.5" y="162" style="fill:#e6edf3;font:600 13px -apple-system,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif">커밋 <tspan style="fill:#79c0ff">720+</tspan></text></svg>
