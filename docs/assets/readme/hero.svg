<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="Auto_Trading"><title>Auto_Trading</title><style>
.t{fill:#59636e;font:12px -apple-system,'Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif}
