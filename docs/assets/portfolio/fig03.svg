<svg style="background:#ffffff" viewBox="0 0 760 210" width="760" height="210" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker></defs><rect x="1.0" y="30" width="108" height="74" rx="6" fill="#f3f5f8" stroke="#d9dde5"/><text x="11.0" y="52.0" font-size="10" fill="#2350a8" text-anchor="start" font-weight="700">01</text><text x="11.0" y="72.0" font-size="12.5" fill="#1b2333" text-anchor="start" font-weight="700">아이디어</text><text x="11.0" y="89.0" font-size="9" fill="#5b6475" text-anchor="start" font-weight="400">책 · 논문 ·</text><text x="11.0" y="101.0" font-size="9" fill="#5b6475" text-anchor="start" font-weight="400">커뮤니티 · 외부</text><line x1="111.0" y1="67" x2="129.0" y2="67" stroke="#5b6475" stroke-width="1.4" marker-end="url(#ah)"/><rect x="131.0" y="30" width="108" height="74" rx="6" fill="#f3f5f8" stroke="#d9dde5"/><text x="141.0" y="52.0" font-size="10" fill="#2350a8" text-anchor="start" font-weight="700">02</text><text x="141.0" y="72.0" font-size="12.5" fill="#1b2333" text-anchor="start" font-weight="700">중복 감사</text><text x="141.0" y="89.0" font-size="9" fill="#5b6475" text-anchor="start" font-weight="400">이미 시험한 질문인가</text><line x1="241.0" y1="67" x2="259.0" y2="67" stroke="#5b6475" stroke-width="1.4" marker-end="url(#ah)"/><rect x="261.0" y="30" width="108" height="74" rx="6" fill="#f3f5f8" stroke="#d9dde5"/><text x="271.0" y="52.0" font-size="10" fill="#2350a8" text-anchor="start" font-weight="700">03</text><text x="271.0" y="72.0" font-size="12.5" fill="#1b2333" text-anchor="start" font-weight="700">검정력 관문</text><text x="271.0" y="89.0" font-size="9" fill="#5b6475" text-anchor="start" font-weight="400">자료로 가릴 수</text><text x="271.0" y="101.0" font-size="9" fill="#5b6475" text-anchor="start" font-weight="400">있는가</text><line x1="371.0" y1="67" x2="389.0" y2="67" stroke="#5b6475" stroke-width="1.4" marker-end="url(#ah)"/><rect x="391.0" y="30" width="108" height="74" rx="6" fill="#e8eefb" stroke="#d9dde5"/><text x="401.0" y="52.0" font-size="10" fill="#2350a8" text-anchor="start" font-weight="700">04</text><text x="401.0" y="72.0" font-size="12.5" fill="#1b2333" text-anchor="start" font-weight="700">사전 등록</text><text x="401.0" y="89.0" font-size="9" fill="#5b6475" text-anchor="start" font-weight="400">규칙 · 기준을 커밋</text><line x1="501.0" y1="67" x2="519.0" y2="67" stroke="#5b6475" stroke-width="1.4" marker-end="url(#ah)"/><rect x="521.0" y="30" width="108" height="74" rx="6" fill="#e8eefb" stroke="#d9dde5"/><text x="531.0" y="52.0" font-size="10" fill="#2350a8" text-anchor="start" font-weight="700">05</text><text x="531.0" y="72.0" font-size="12.5" fill="#1b2333" text-anchor="start" font-weight="700">1회 판정</text><text x="531.0" y="89.0" font-size="9" fill="#5b6475" text-anchor="start" font-weight="400">결과는 한 번만 연다</text><line x1="631.0" y1="67" x2="649.0" y2="67" stroke="#5b6475" stroke-width="1.4" marker-end="url(#ah)"/><rect x="651.0" y="30" width="108" height="74" rx="6" fill="#f3f5f8" stroke="#d9dde5"/><text x="661.0" y="52.0" font-size="10" fill="#2350a8" text-anchor="start" font-weight="700">06</text><text x="661.0" y="72.0" font-size="12.5" fill="#1b2333" text-anchor="start" font-weight="700">기록</text><text x="661.0" y="89.0" font-size="9" fill="#5b6475" text-anchor="start" font-weight="400">재시도 금지 목록</text><text x="185.0" y="128.0" font-size="9.5" fill="#5b6475" text-anchor="middle" font-weight="400">↓ 이미 답이 있으면 종료</text><text x="315.0" y="146.0" font-size="9.5" fill="#5b6475" text-anchor="middle" font-weight="400">↓ 표본 부족이면 &#x27;자료 부족&#x27;</text><text x="575.0" y="128.0" font-size="9.5" fill="#5b6475" text-anchor="middle" font-weight="400">↓ 기준 미달이면 기각</text><rect x="1.0" y="164" width="758" height="30" rx="6" fill="#fff6e6" stroke="#f0d9a8"/><text x="380.0" y="184.0" font-size="10.5" fill="#8a5a00" text-anchor="middle" font-weight="700">판정 뒤에는 같은 자료로 숫자만 바꿔 다시 판정하지 않는다 — 새 질문은 새 자료로</text></svg>