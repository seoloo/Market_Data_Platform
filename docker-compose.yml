# Market Data Platform 로컬 서비스 — 필요한 것만 프로필로 켠다 (단일 PC, README 그림 2).
#
#   docker compose --profile db up -d      # 로컬 PostgreSQL (실행 기록 · 감사 결과 · 조회용 표)
#   docker compose --profile db down       # 끄기 (자료는 이름 있는 볼륨 mdp_pg 에 남는다)
#   docker compose --profile spark build   # Spark + Delta 이미지 만들기 (한 번)
#   docker compose run --rm spark python -m mdp.silver.agg_trades --symbol BTCUSDT --month 2024-03
#
# 접속: postgresql://mdp:<MDP_PG_PASSWORD>@127.0.0.1:56432/mdp
#   - 이 PC 에서만 열린다(127.0.0.1). 비밀번호는 환경 변수 MDP_PG_PASSWORD, 없으면 시연용 기본값.
#   - 포트 56432: 같은 PC 의 다른 프로젝트 PostgreSQL(55432 등)과 겹치지 않게 골랐다.
# 레이크 위치 (호스트 → 컨테이너):
#   - MDP_BRONZE_ROOT (기본 ./data/lake/bronze) → /lake/bronze  읽기만 — Bronze 는 Spark 가 바꾸지 않는다
#   - MDP_LAKE_ROOT   (기본 ./data/lake)        → /lake         Silver · Gold Delta 표를 쓴다
# 다음 프로필(stream · airflow)은 해당 단계(README 4-6 · 5)에서 더한다.

name: mdp

services:
  postgres:
    image: postgres:17.6
    profiles: ["db"]
    environment:
      POSTGRES_DB: mdp
      POSTGRES_USER: mdp
      POSTGRES_PASSWORD: ${MDP_PG_PASSWORD:-mdp_local_only}
    ports:
      - "127.0.0.1:56432:5432"
    volumes:
      - mdp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdp -d mdp"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  spark:
    build: docker/spark
    image: mdp-spark:4.0.1-delta4.0.1
    profiles: ["spark"]
    environment:
      MDP_BRONZE_ROOT: /lake/bronze
      MDP_LAKE_ROOT: /lake
      MDP_STAGING_ROOT: /staging
      # 실행 기록: 컨테이너 안에서 호스트의 PostgreSQL(56432)로. 비워 두면 기록 없이 돈다.
      MDP_PG_DSN: ${MDP_PG_DSN_CONTAINER:-postgresql://mdp:mdp_local_only@host.docker.internal:56432/mdp}
      # Spark 드라이버 메모리 — 로컬 모드는 드라이버 하나가 모두 한다. Docker 에 준 메모리 안에서.
      MDP_SPARK_MEMORY: ${MDP_SPARK_MEMORY:-6g}
      MDP_SPARK_CORES: ${MDP_SPARK_CORES:-8}
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro            # 컨테이너 안 Spark 시험 (tests/mdp/spark)
      - ./manifests:/app/manifests:ro
      - ${MDP_LAKE_ROOT:-./data/lake}:/lake
      - ${MDP_BRONZE_ROOT:-./data/lake/bronze}:/lake/bronze:ro
      - mdp_staging:/staging
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mdp_pg:
  mdp_staging:
