[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-trading"
version = "0.1.0"
description = "BTC/USDT 무기한 선물 자동매매 시스템"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "websockets>=13",  # USD-M 사용자 스트림 (exchange/binance_usdm_stream.py)
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
# 레이크하우스 파이프라인(src/mdp) — 실행 기록 PostgreSQL 접속
lake = [
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "hypothesis>=6.100",
    "import-linter>=2.0",
    "types-PyYAML",
    # 실행 기록(src/mdp/runlog) 시험 · 타입 검사에 필요 — CI 는 dev 만 설치한다
    "psycopg[binary]>=3.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/auto_trading", "src/mdp"]


# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# 문서의 코드 블록은 의사코드가 섞여 있으므로 포맷 대상에서 제외한다.
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "DTZ",  # naive datetime 금지 (AGENTS.md §3.1)
    "T20",  # print 금지 (AGENTS.md §4)
    "SIM",  # simplify
    "RET",  # return
    "PTH",  # pathlib
    "RUF",
]
ignore = [
    "RUF001",  # 한글 주석의 전각 문자 오탐
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
# 실행 스크립트는 콘솔 출력이 본래 목적이다.
"scripts/**" = ["T20"]
# 포트폴리오 보고서 생성기 — 한국어 문단 · HTML · SVG 문자열이 대부분이라 줄 길이 · 짧은 이름 규칙을 보지 않는다.
"scripts/portfolio/**" = ["T20", "E501", "N802", "N806", "N812"]
# PySpark 관례 `from pyspark.sql import functions as F` 를 따른다.
"src/mdp/silver/**" = ["N812"]
"src/mdp/gold/**" = ["N812"]
"tests/mdp/spark/**" = ["N812"]

[tool.ruff.lint.isort]
known-first-party = ["auto_trading"]


# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
files = ["src", "tests"]

# pyspark · delta 는 Spark 이미지(docker/spark) 안에만 있다 — 호스트 mypy 는 타입 정보 없이 지나간다.
[[tool.mypy.overrides]]
module = ["pyspark.*", "delta.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scripts.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false


# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: 오래 걸리는 테스트",
    "leakage: look-ahead 누출 탐지 (절대 스킵 금지)",
    "golden: 백테스트 골든 테스트",
    "integration: FakeExchange 통합 테스트",
    "postgres: 로컬 PostgreSQL 이 있어야 도는 시험 (MDP_TEST_PG_DSN 없으면 건너뜀)",
]


# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["src/auto_trading"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]


# ---------------------------------------------------------------- import-linter
# AGENTS.md §3.1 Pure Core 원칙을 CI에서 강제한다.
[tool.importlinter]
root_package = "auto_trading"

[[tool.importlinter.contracts]]
name = "Pure Core 는 I/O 계층을 import 하지 않는다"
type = "forbidden"
source_modules = [
    "auto_trading.core",
    "auto_trading.features",
    "auto_trading.strategy",
    "auto_trading.risk",
]
forbidden_modules = [
    "auto_trading.exchange",
    "auto_trading.storage",
    "auto_trading.marketdata",
    "auto_trading.notify",
    "auto_trading.ai",
    "auto_trading.execution",
    "auto_trading.backtest",
    "auto_trading.app",
    "auto_trading.ops",
]

# UI 는 읽기 전용 대시보드다. 매매 로직에 닿으면 안 된다 (D10 §3.2).
[[tool.importlinter.contracts]]
name = "UI 는 매매 로직을 import 하지 않는다"
type = "forbidden"
source_modules = ["auto_trading.ui"]
forbidden_modules = [
    "auto_trading.exchange",
    "auto_trading.execution",
    "auto_trading.strategy",
    "auto_trading.risk",
    "auto_trading.ai",
    "auto_trading.backtest",
]

# 순수 계층은 config.schema(모델)만 쓰고 config.loader(파일 I/O)는 쓰지 않는다.
[[tool.importlinter.contracts]]
name = "Pure Core 는 설정 로더를 import 하지 않는다"
type = "forbidden"
source_modules = [
    "auto_trading.core",
    "auto_trading.features",
    "auto_trading.strategy",
    "auto_trading.risk",
]
forbidden_modules = ["auto_trading.config.loader"]

[[tool.importlinter.contracts]]
name = "core 는 최하위 계층이다"
type = "forbidden"
source_modules = ["auto_trading.core"]
forbidden_modules = [
    "auto_trading.features",
    "auto_trading.strategy",
    "auto_trading.risk",
    "auto_trading.config",
]

# 독립 연구는 운영/매매 판단 경로가 끌어오지 않는다.
[[tool.importlinter.contracts]]
name = "독립 연구는 매매 경로에서 import 하지 않는다"
type = "forbidden"
source_modules = [
    "auto_trading.core",
    "auto_trading.features",
    "auto_trading.strategy",
    "auto_trading.risk",
    "auto_trading.execution",
    "auto_trading.exchange",
    "auto_trading.app",
]
forbidden_modules = [
    "auto_trading.research.elliott",
    "auto_trading.research.option_protection",
    "auto_trading.research.staking_carry",
    "auto_trading.research.fundamental_pit",
    "auto_trading.research.sec_fundamentals",
    "auto_trading.research.fundamental_market_audit",
]
